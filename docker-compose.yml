version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: memorybridge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: memorybridge
      POSTGRES_PASSWORD: memorybridge
      POSTGRES_DB: memorybridge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql

  redis:
    image: redis:7
    container_name: memorybridge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
